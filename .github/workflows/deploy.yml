name: Build & Deploy Static Site

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  # ========================================
  # Build
  # ========================================

  build:
    name: Build Laravel Static Site
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout full Laravel repository
      # ----------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------
      # PHP
      # ----------------------------------------

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer
          coverage: none


      # ----------------------------------------
      # Composer
      # ----------------------------------------

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader


      # ----------------------------------------
      # Node
      # ----------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ----------------------------------------
      # NPM
      # ----------------------------------------

      - name: Install NPM dependencies
        run: npm ci


      # ----------------------------------------
      # Vite
      # ----------------------------------------

      - name: Build frontend
        run: npm run build


      # ----------------------------------------
      # Laravel → Static HTML
      # ----------------------------------------

      - name: Export static website
        run: php artisan static:export


      # ----------------------------------------
      # GitHub Pages
      # ----------------------------------------

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ----------------------------------------
      # Upload ONLY dist/
      # ----------------------------------------

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # ========================================
  # Deploy
  # ========================================

  deploy:
    name: Deploy dist to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4